[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anaxonic-model"
version = "0.1.0"
description = "A compact foundation-model research scaffold."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26,<2",
]

[project.optional-dependencies]
data = [
  "datasets>=2.19",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
